networks:
    openstatus:
        driver: bridge
        name: openstatus

volumes:
    libsql-data:
        name: openstatus-libsql-data
    workflows-data:
        name: openstatus-workflows-data

services:
    # External services
    libsql:
        container_name: openstatus-libsql
        image: ghcr.io/tursodatabase/libsql-server:latest
        networks:
            - openstatus
        ports:
            - "8080:8080"
            - "5001:5001"
        volumes:
            - libsql-data:/var/lib/sqld
        environment:
            - SQLD_NODE=primary
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'perl -e ''use IO::Socket::INET; exit(IO::Socket::INET->new(PeerAddr=>"127.0.0.1:8080",Timeout=>1) ? 0 : 1);''',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    # Analytics (optional, ~6GB RAM). Off by default so the stack runs on an
    # 8GB Docker; nothing depends on it. Enable with:
    #   docker compose --profile analytics up -d
    tinybird-local:
        container_name: openstatus-tinybird
        image: tinybirdco/tinybird-local:latest
        platform: linux/amd64
        profiles:
            - analytics
        networks:
            - openstatus
        ports:
            - "7181:7181"
        environment:
            - COMPATIBILITY_MODE=1
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:7181/"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        restart: unless-stopped

    # Migrations
    # The workflows runtime image is distroless (no shell/deno/source), so it
    # can't self-migrate. This one-shot service runs the migrator from the
    # workflows *build* stage, which has deno + source + drizzle SQL. App
    # services gate on it via `service_completed_successfully`.
    migrate:
        container_name: openstatus-migrate
        build:
            context: .
            dockerfile: apps/workflows/Dockerfile
            target: build
        image: openstatus/workflows-migrate:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
        entrypoint:
            ["sh", "-c", "cd /app/packages/db && deno run -A src/migrate.mts"]
        depends_on:
            libsql:
                condition: service_healthy
        restart: "no"

    # Optional one-shot seed. Not run by default; invoke explicitly with:
    #   docker compose --profile seed run --rm seed
    seed:
        container_name: openstatus-seed
        profiles:
            - seed
        image: openstatus/workflows-migrate:latest
        build:
            context: .
            dockerfile: apps/workflows/Dockerfile
            target: build
        # Share libsql's network namespace so 127.0.0.1:8080 reaches the DB —
        # seed.mts refuses any DATABASE_URL that isn't localhost/127.0.0.1.
        network_mode: "service:libsql"
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://127.0.0.1:8080
        entrypoint:
            [
                "sh",
                "-c",
                "cd /app/packages/db && deno run -A --sloppy-imports src/seed.mts",
            ]
        depends_on:
            migrate:
                condition: service_completed_successfully
        restart: "no"

    # Internal Services
    workflows:
        container_name: openstatus-workflows
        build:
            context: .
            dockerfile: apps/workflows/Dockerfile
        image: openstatus/workflows:latest
        networks:
            - openstatus
        ports:
            - "3000:3000"
        volumes:
            - workflows-data:/app/data
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
        depends_on:
            migrate:
                condition: service_completed_successfully
            libsql:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    server:
        container_name: openstatus-server
        build:
            context: .
            dockerfile: apps/server/Dockerfile
        image: openstatus/server:latest
        networks:
            - openstatus
        ports:
            - "3001:3000"
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
        depends_on:
            workflows:
                condition: service_healthy
            libsql:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    # Local checker: performs on-demand HTTP/TCP/DNS tests and check runs.
    # CLOUD_PROVIDER=koyeb skips fly-region forwarding so any requested region
    # runs locally; it reports results tagged region=koyeb_fra (a valid region).
    checker:
        container_name: openstatus-checker
        build:
            context: apps/checker
            dockerfile: Dockerfile
        image: openstatus/checker:latest
        networks:
            - openstatus
        ports:
            - "8082:8080"
        env_file:
            - .env.docker
        environment:
            - PORT=8080
            - GIN_MODE=release
            - CLOUD_PROVIDER=koyeb
            - KOYEB_REGION=fra
        restart: unless-stopped

    private-location:
        container_name: openstatus-private-location
        build:
            context: apps/private-location
            dockerfile: Dockerfile
        image: openstatus/private-location:latest
        networks:
            - openstatus
        ports:
            - "8081:8080"
        env_file:
            - .env.docker
        environment:
            - DB_URL=http://libsql:8080
            - TINYBIRD_URL=http://tinybird-local:7181
            - WORKFLOWS_URL=http://workflows:3000
            - GIN_MODE=release
            - PORT=8080
        depends_on:
            server:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:8080/health",
                ]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    dashboard:
        container_name: openstatus-dashboard
        build:
            context: .
            dockerfile: apps/dashboard/Dockerfile
        image: openstatus/dashboard:latest
        networks:
            - openstatus
        ports:
            - "3002:3000"
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - AUTH_TRUST_HOST=true
        depends_on:
            workflows:
                condition: service_healthy
            libsql:
                condition: service_healthy
            server:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 45s
        restart: unless-stopped

    status-page:
        container_name: openstatus-status-page
        build:
            context: .
            dockerfile: apps/status-page/Dockerfile
        image: openstatus/status-page:latest
        networks:
            - openstatus
        ports:
            - "3003:3000"
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - AUTH_TRUST_HOST=true
        depends_on:
            workflows:
                condition: service_healthy
            libsql:
                condition: service_healthy
            server:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 45s
        restart: unless-stopped
